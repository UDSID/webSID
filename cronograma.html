<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <script>
    // Se ejecuta de inmediato antes de que el navegador renderice el <body>
    (function() {
        const theme = localStorage.getItem('theme');
        // Si la preferencia guardada es 'dark' o si es la primera vez (null), forzar 'dark'
        if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronograma - SID (Sociedad de Innovación y Desarrollo)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0b1319',
                        cardDark: '#121e28',
                        primaryAccent: '#38bdf8',
                        pinkAccent: '#f472b6'
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-[#0b1319] text-slate-900 dark:text-white min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white transition-colors duration-300">

    <!-- Header / Navigation -->
    <div id="header-container"></div>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow max-w-7xl mx-auto px-6 py-10 w-full space-y-12">

        <!-- Header del Cronograma -->
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-sky-500 dark:text-sky-400">Cronograma de Actividades</h1>
            <p class="text-slate-600 dark:text-slate-400 text-sm max-w-xl mx-auto">
                Consulta los talleres, conferencias y eventos programados para este semestre.
            </p>
        </div>

        <!-- 1. Vista de Calendario por Semanas -->
        <section
            class="bg-white dark:bg-[#121e28] border border-slate-200 dark:border-white/5 rounded-3xl p-6 shadow-sm space-y-6">
            <!-- Navegación de Semanas -->
            <div
                class="flex flex-col sm:flex-row justify-between items-center gap-4 border-b border-slate-200 dark:border-white/5 pb-4">
                <h2 id="calendar-range-title"
                    class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-sky-500">calendar_month</span> Cargando rango...
                </h2>
                <div class="flex items-center gap-2">
                    <button id="prev-week-btn"
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors"
                        aria-label="Semana anterior">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </button>
                    <button id="today-btn"
                        class="px-3 py-1.5 text-xs font-semibold rounded-xl border border-sky-500 text-sky-500 hover:bg-sky-500 hover:text-white transition-colors">
                        Hoy
                    </button>
                    <button id="next-week-btn"
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition-colors"
                        aria-label="Semana siguiente">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </button>
                </div>
            </div>

            <!-- Grilla de 7 Columnas (Días) -->
            <div id="calendar-grid" class="grid grid-cols-7 gap-2 md:gap-3 text-center">
                <!-- Se renderiza dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- 2. Sección de Eventos Destacados / Próximos -->
        <section class="space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-pink-500">event_upcoming</span>
                    Próximas Actividades
                </h2>
                <span class="text-xs text-slate-500 dark:text-slate-400">Actualizado dinámicamente</span>
            </div>

            <!-- Grid de 2 columnas en Desktop -->
            <div id="upcoming-events-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Se renderiza dinámicamente con JavaScript -->
            </div>
        </section>

    </main>


    <!-- Unified Footer -->
   <div id="footer-container"></div>

    <!-- Shared JavaScript -->
    <script src="script.js"></script>
    <script src="components/components.js"></script>
</body>

</html>
