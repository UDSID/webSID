<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <script>
    // Se ejecuta de inmediato antes de que el navegador renderice el <body>
    (function() {
        const theme = localStorage.getItem('theme');
        // Si la preferencia guardada es 'dark' o si es la primera vez (null), forzar 'dark'
        if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades - SID (Sociedad de Innovación y Desarrollo)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0b1319',
                        cardDark: '#121e28',
                        primaryAccent: '#38bdf8',
                        pinkAccent: '#f472b6'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-[#0b1319] text-slate-900 dark:text-white min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white transition-colors duration-300">

    <!-- Header / Navigation -->
    <div id="header-container"></div>
    <!-- Main Content -->
    <main id="main-content" class="flex-grow max-w-7xl mx-auto px-6 py-10 w-full space-y-16">

        <!-- Encabezado de Sección con Ilustración -->
        <section
            class="flex flex-col-reverse md:flex-row items-center justify-between gap-8 bg-slate-100 dark:bg-[#121e28] border border-slate-200 dark:border-white/5 rounded-3xl p-8 md:p-12">
            <div class="space-y-4 max-w-xl">
                <h1 class="text-4xl md:text-5xl font-black text-slate-900 dark:text-white">
                    Explora Nuestras <span class="text-sky-500 dark:text-sky-400">Actividades</span>
                </h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base leading-relaxed">
                    Sumérgete en el ecosistema de innovación. Descubre los proyectos, talleres y eventos donde la
                    creatividad y el desarrollo técnico se encuentran.
                </p>

                <!-- Sistema de Filtros (Tabs Pills) -->
                <div class="flex flex-wrap gap-3 pt-4" id="filter-tabs">
                    <button data-filter="todos"
                        class="tab-btn active px-5 py-2 rounded-full text-xs font-semibold border transition-all duration-200">
                        Todas
                    </button>
                    <button data-filter="en_curso"
                        class="tab-btn px-5 py-2 rounded-full text-xs font-semibold border transition-all duration-200">
                        En curso
                    </button>
                    <button data-filter="por_empezar"
                        class="tab-btn px-5 py-2 rounded-full text-xs font-semibold border transition-all duration-200">
                        Por empezar
                    </button>
                    <button data-filter="terminadas"
                        class="tab-btn px-5 py-2 rounded-full text-xs font-semibold border transition-all duration-200">
                        Terminadas
                    </button>
                </div>
            </div>

            <!-- Mascota / Ilustración -->
            <div class="w-48 md:w-64 flex-shrink-0 flex justify-center">
                <img src="assets/pacha/Mesa de trabajo 21 copia 2-8.png" alt="Mascota SID"
                    class="w-full h-auto object-contain drop-shadow-xl" />
            </div>
        </section>

        <!-- Grid Responsive de Tarjetas de Actividades (1 col móvil, 2 tablet, 3 desktop) -->
        <section>
            <div id="actividades-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Se renderiza dinámicamente con JavaScript -->
            </div>
        </section>

        <!-- Galería Fotográfica (Sección Inferior) -->
        <section class="space-y-6 pt-6">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-bold text-slate-900 dark:text-white">Galería Fotográfica</h2>

            </div>

            <!-- Layout Grid Asimétrico (1 col móvil, 3 col desktop) -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6" id="galeria-grid">
                <!-- Tarjeta destacada izquierda (Spans 1 col, o 2 según pantalla) -->
                <div id="galeria-destacada" class="lg:col-span-1">
                    <!-- Dinámico -->
                </div>

                <!-- Cuadrícula secundaria derecha + Tarjeta de archivo -->
                <div id="galeria-secundaria" class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Dinámico -->
                </div>
            </div>
        </section>

    </main>


    <!-- Unified Footer -->
    <div id="footer-container"></div>
    <div id="image-modal"
        class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4 transition-all duration-300">
        <button id="modal-close"
            class="absolute top-5 right-5 text-white/80 hover:text-white bg-slate-800/60 hover:bg-slate-800 p-2 rounded-full transition-colors z-10 flex items-center justify-center"
            aria-label="Cerrar ventana">
            <span class="material-symbols-outlined text-2xl">close</span>
        </button>

        <div
            class="relative max-w-5xl max-h-[90vh] flex flex-col items-center justify-center bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-white/10">
            <img id="modal-img" src="" alt="" class="max-h-[75vh] w-auto object-contain select-none" />

            <div class="w-full p-4 bg-slate-900/90 border-t border-white/10 text-center">
                <h3 id="modal-title" class="text-lg font-bold text-white"></h3>
                <p id="modal-desc" class="text-xs text-slate-300 mt-1"></p>
            </div>
        </div>
    </div>
    <!-- Shared JavaScript -->
    <script src="script.js"></script>
    <script src="components/components.js"></script>
</body>

</html>
