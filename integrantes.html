<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <script>
    // Se ejecuta de inmediato antes de que el navegador renderice el <body>
    (function() {
        const theme = localStorage.getItem('theme');
        // Si la preferencia guardada es 'dark' o si es la primera vez (null), forzar 'dark'
        if (theme === 'dark' || !theme) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrantes - SID (Sociedad de Innovación y Desarrollo)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brandDark: '#0b1319',
                        cardDark: '#121e28',
                        primaryAccent: '#38bdf8',
                        pinkAccent: '#f472b6'
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@600;700;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <!-- Font Awesome Icons para Redes Sociales -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css">
</head>

<body
    class="bg-slate-50 dark:bg-[#0b1319] text-slate-900 dark:text-white min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white transition-colors duration-300">

    <!-- Header / Navigation -->
   <div id="header-container"></div>

    <!-- Main Content -->
    <main id="main-content" class="flex-grow max-w-7xl mx-auto px-6 py-10 w-full space-y-16">

        <!-- Grid principal que integra la tarjeta de título y los integrantes -->
        <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            <!-- Tarjeta 1: Encabezado compacto (Aspecto de cuadrado/card) -->
            <div
                class="bg-slate-100 dark:bg-[#121e28] border border-slate-200 dark:border-white/5 rounded-3xl p-6 flex flex-col justify-between relative overflow-hidden min-h-[320px]">
                <div class="space-y-3 z-10">
                    <h1 class="text-3xl font-black text-slate-900 dark:text-white leading-tight">
                        Nuestros <br /><span class="text-sky-400">Integrantes</span>
                    </h1>
                    <p class="text-slate-600 dark:text-slate-400 text-xs leading-relaxed">
                        El corazón de la Sociedad de Innovación y Desarrollo. Conoce a los constructores del futuro.
                    </p>
                </div>

                <!-- Mascota SID colocada al pie de la tarjeta -->
                <div class="w-28 self-end z-10 -mr-2 -mb-2">
                    <img src="assets/pacha/Mesa de trabajo 21 copia 2-8.png" alt="Mascota SID"
                        class="w-full h-auto object-contain drop-shadow-lg" />
                </div>
            </div>

            <!-- Contenedor dinámico donde script.js inyecta el resto de tarjetas -->
            <!-- Nota: En JS los elementos dinámicos se adjuntarán a esta misma retícula o usaremos integrantes-grid directamente si preferimos que convivan. -->
            <div id="integrantes-grid-container" class="contents">
                <div id="integrantes-grid" class="contents">
                    <!-- Se renderizan dinámicamente con JavaScript desde integrantes.json -->
                </div>
            </div>

        </section>

        <!-- Banner CTA de Reclutamiento -->
        <section
            class="bg-slate-100 dark:bg-[#121e28] border border-slate-200 dark:border-white/5 rounded-3xl p-8 md:p-12 text-center space-y-6 max-w-4xl mx-auto shadow-sm">
            <div
                class="w-14 h-14 bg-sky-500/10 rounded-2xl flex items-center justify-center mx-auto overflow-hidden p-2">
                <img src="assets/logo/Mesa de trabajo 21 copia 13-8.png" alt="Icono Reclutamiento"
                    class="w-full h-full object-contain" />
            </div>
            <div class="space-y-2">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-900 dark:text-white">
                    ¿Quieres ser parte del equipo?
                </h2>
                <p class="text-slate-600 dark:text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                    Buscamos mentes curiosas, apasionadas por la tecnología y listas para construir soluciones que
                    impacten.
                </p>
            </div>
            <div class="pt-2">
                <a href="https://chat.whatsapp.com/DG2lJjWyTDB14OtOAap9zr?s=cl&p=a&ilr=1" target="_blank"
                    rel="noopener noreferrer"
                    class="inline-flex items-center gap-2 bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm px-8 py-3.5 rounded-full shadow-lg hover:shadow-sky-500/25 transition-all">
                    <span>Unirme al Grupo</span>
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </a>
            </div>
        </section>

    </main>


    <!-- Unified Footer -->
    <div id="footer-container"></div>

    <!-- Shared JavaScript -->
    <script src="script.js"></script>
    <script src="components/components.js"></script>
</body>

</html>
